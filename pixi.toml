[workspace]
channels = ["conda-forge"]
name = "aer-flow"
platforms = ["win-64", "linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Builds external/aer-core's native library. The Aer.Core.csproj ProjectReference (Aer.Flow ->
# Aer.Core, M7 Phase 6's Core Dispatcher) copies this binary from external/aer-core/target/debug/
# into the output directory only if it already exists there, so this must run before any dotnet
# task that touches Aer.Flow. Requires a Rust toolchain on PATH — installed separately, not pixi-
# managed (same convention as the .NET SDK below); GitHub Actions' standard runner images already
# have one.
build-core = { cmd = "cargo build", cwd = "external/aer-core" }

# M21 Phase 5 (#242): the tsnet-embedding sidecar Aer.Daemon spawns as a child process in --remote
# mode. Go-only (no .NET tsnet binding exists) — a separate toolchain, same convention as the Rust
# one above: installed separately, not pixi-managed locally (Windows: `winget install GoLang.Go`);
# CI installs it explicitly via actions/setup-go (ci.yml) rather than assuming a runner image
# already has one — that assumption turned out false for macos-latest. No dotnet build depends on
# this at compile time (Aer.Daemon only needs the compiled binary present at runtime, when it
# actually spawns it), but it's part of the full verification loop below. Output name has no .exe
# on linux-64/osx-arm64 (overridden below) — Aer.Daemon.csproj's copy-if-exists looks for plain
# `aer-sidecar` on non-Windows, matching Go's own native naming convention.
build-sidecar = { cmd = "go build -o bin/aer-sidecar .", cwd = "src/Aer.Sidecar" }
test-sidecar = { cmd = "go test ./...", cwd = "src/Aer.Sidecar" }
lint-sidecar = { cmd = "go vet ./...", cwd = "src/Aer.Sidecar" }
fmt-sidecar = { cmd = "gofmt -w .", cwd = "src/Aer.Sidecar" }
fmt-check-sidecar = { cmd = "test -z \"$(gofmt -l .)\"", cwd = "src/Aer.Sidecar" }

build = { cmd = "dotnet build", depends-on = ["build-core", "build-sidecar"] }
test = { cmd = "dotnet test", depends-on = ["build-core", "test-sidecar"] }
# Coverage report (#199): collects per-test-project Cobertura via coverlet, merges into an HTML
# report + text summary at artifacts/coverage/report/ (open index.html, or read Summary.txt).
# Results are wiped first so stale collections never skew the merge. Excludes source-generated
# code by attribute (coverage.runsettings); external/aer-core's Rust library is invisible to .NET
# coverage by nature — its own `pixi run coverage` (cargo-llvm-cov) lives in the aer-core repo.
coverage = { cmd = "rm -rf artifacts/coverage && dotnet tool restore && dotnet test --collect:\"XPlat Code Coverage\" --settings coverage.runsettings --results-directory artifacts/coverage && dotnet reportgenerator -reports:artifacts/coverage/**/coverage.cobertura.xml -targetdir:artifacts/coverage/report \"-reporttypes:Html;TextSummary\" \"-assemblyfilters:+Aer.*\"", depends-on = ["build-core"] }

fmt = "dotnet format"
fmt-check = { cmd = "dotnet format --verify-no-changes", depends-on = ["fmt-check-sidecar"] }

# M25 (#345): regenerates both toolkits' theme resources from design/tokens.json. Not wired into
# build — generated artifacts are checked in, and Aer.Architecture.Tests fails if they drift from the
# token file, so running this is a deliberate act after editing tokens rather than a build side
# effect that rewrites tracked files under everyone.
tokens = "dotnet run --project tools/Aer.DesignTokens"
lint = { cmd = "dotnet build -warnaserror", depends-on = ["build-core", "lint-sidecar"] }

# M21 Phase 2 (#232): Flutter/Dart aren't pixi-managed — installed separately, on PATH, same
# convention as the .NET SDK and Rust toolchain above. mobile-build produces a debug APK only:
# Aer.Mobile is sideload-only for this milestone (no Play Store signing/release config exists).
mobile-analyze = { cmd = "flutter analyze", cwd = "src/Aer.Mobile" }
# Excludes the `journey` tag: journey tests (#313) are red-specs run separately via
# `pixi run journey-mobile`, so the default suite stays green (see dart_test.yaml).
mobile-test = { cmd = "flutter test --exclude-tags journey", cwd = "src/Aer.Mobile" }
# Wrapped rather than a plain `flutter build apk`: Flutter's native-asset hook runner strips the
# environment before invoking Go, so the build cache can't be located and the tailscale native
# asset fails to compile. scripts/mobile-build.sh restores it via a PATH shim (see #303).
mobile-build = { cmd = "bash scripts/mobile-build.sh" }
mobile-run = { cmd = "flutter run --debug", cwd = "src/Aer.Mobile" }
mobile-install = { cmd = "flutter install --debug", cwd = "src/Aer.Mobile" }

# #303: patches the `tailscale` package in the local pub cache so Aer.Mobile survives startup on an
# x86_64 Android emulator — without it the process is killed by seccomp (SIGSYS on epoll_wait)
# before Flutter renders anything, making emulator and CI-based mobile testing impossible. Not a
# dependency of mobile-build: it mutates a shared, machine-global cache, so it stays an explicit
# opt-in rather than something an ordinary build silently does. Idempotent; run once per machine
# (and again after `flutter pub cache repair`). Retire once upstream ships the fix.
mobile-patch = { cmd = "bash scripts/patch-tailscale-dart.sh" }

# M13 Phase 1 (#107): packs Aer.Cli as an installable global dotnet tool (nupkg), embedding the
# native aer_core library for the current host OS. Not part of `build`/`test`/`lint` — packing
# isn't needed for everyday development, only for the install round trip this phase's runbook-style
# verification exercises (`dotnet tool install --global --add-source bin/pack <PackageId>`).
pack = { cmd = "dotnet pack src/Aer.Cli/Aer.Cli.csproj -o bin/pack", depends-on = ["build-core"] }

# Validates what a live smoke run ASSUMES, before it is allowed to spend anything. Free: reads
# files and queries `agy models` / `claude auth status`, and starts no billable session. Every
# smoke-* task depends on it, so a stale assumption stops the run instead of being paid for.
#
# It exists because `gemini-3-flash` -- a model agy does not have -- sat in a binding fixture, two
# dialogue participants and two runbooks while enforcing nothing: claude REJECTS an unknown --model
# and self-reports, agy ACCEPTS it and silently runs its own default. Two smoke tests were therefore
# running on whatever agy defaulted to while the repo read as if a cheap model was pinned. The gate
# prints what it CANNOT check as well as what it did, so passing it is never read as "all clear".
smoke-preflight = { cmd = "python -u tools/smoke-preflight/preflight.py" }

# M11 Phase 4 (#87), the milestone's completion gate: a real draft → review workflow run through
# `aer run` against the real, authenticated `claude` CLI, never `pixi run test`'s stub/shell-stub
# path, and never invoked from CI. Requires a `claude` CLI on PATH already logged in (or an API
# key configured for it) and outbound network access. `Aer.Cli.SmokeTests` is deliberately absent
# from AerFlow.slnx so it never builds or runs as a side effect of `build`/`test`/`lint`. See
# docs/runbooks/live-claude-smoke.md before running this.
smoke-claude = { cmd = "dotnet test tests/Aer.Cli.SmokeTests", depends-on = ["build-core", "smoke-preflight"] }

# M12 Phase 4 (#98), this milestone's completion gate: a real draft (`claude`) → review (`agy`)
# workflow, paused at review's declared PausePoint and resumed via `aer decide`, run through the
# real, authenticated `claude` and `agy` CLIs. Same CI exclusion as smoke-claude above — requires
# both CLIs on PATH already logged in (or API keys configured) and outbound network access to both
# vendors' APIs. See docs/runbooks/live-mixed-vendor-smoke.md before running this.
smoke-mixed-vendor = { cmd = "dotnet test tests/Aer.Cli.SmokeTests --filter FullyQualifiedName~LiveMixedVendorPausedRunSmokeTest", depends-on = ["build-core", "smoke-preflight"] }

# M17 Phase 5 (#168), this milestone's completion gate: a real, bounded Claude <-> agy dialogue
# exchange, run through the dialogue worker (Aer.Workers.Dialogue) via the "dialogue" adapter, driven
# through `aer run` against both real, authenticated CLIs. Same CI exclusion as smoke-claude/
# smoke-mixed-vendor above -- requires both CLIs on PATH already logged in (or API keys configured)
# and outbound network access to both vendors' APIs. See docs/runbooks/live-dialogue-smoke.md before
# running this.
smoke-dialogue = { cmd = "dotnet test tests/Aer.Cli.SmokeTests --filter FullyQualifiedName~LiveDialogueSmokeTest", depends-on = ["build-core", "smoke-preflight"] }

# M24 Phase 1/2 (#262/#263) completion gate, added retroactively: a ~50-turn interactive-session
# stress run plus a compact round trip, driven directly against Aer.Daemon's real HTTP surface
# (sessions have no `aer` CLI command) with the real, authenticated `claude` CLI. Same CI exclusion
# as smoke-claude above. See docs/runbooks/live-session-smoke.md before running this.
smoke-session = { cmd = "dotnet test tests/Aer.Cli.SmokeTests --filter FullyQualifiedName~LiveSessionSmokeTest", depends-on = ["build-core", "smoke-preflight"] }

# Journey tests (#313): the product-journey harness (spec/journeys.md). Two in-process runners —
# desktop legs via Avalonia view-mounted headless, phone legs via Flutter widget tests — plus a
# reconcile gate. Aer.Journeys.Tests is deliberately absent from AerFlow.slnx (same exclusion as
# smoke-* above) so `pixi run test` stays all-green: journey tests are red-specs — a promise the
# product does not keep yet fails its journey test on purpose, so journey-desktop / journey-mobile
# exit non-zero until that capability lands. That red IS the honest status; it is not a broken
# build. Filter to one journey with `--filter Journey=J6` (desktop). See docs/runbooks/journey-tests.md.
journey-desktop = { cmd = "dotnet test tests/Aer.Journeys.Tests", depends-on = ["build-core"] }
journey-mobile = { cmd = "flutter test --tags journey", cwd = "src/Aer.Mobile" }
journey-all = { depends-on = ["journey-desktop", "journey-mobile"] }
# The reconcile gate's structural half: asserts spec/journeys.md and the code-side Journeys registry
# never drift (same set of journeys, byte-identical status lines). Unlike journey-desktop this is
# meant to pass — #314 grows it into a required CI gate that also compares declared status against
# the journey tests' actual pass/fail.
journey-reconcile = { cmd = "dotnet test tests/Aer.Journeys.Tests --filter Category=Reconcile", depends-on = ["build-core"] }

# Vendor probe (#504): establishes what each vendor CLI can actually do, and writes both the
# findings matrix and docs/vendor-probe.lock.json (the versions those findings were established
# against). NEVER runs in CI — it drives live authenticated CLIs and spends real subscription usage,
# the same permanent-human-action-item rule as smoke-* above. It exists because
# docs/vendor-capabilities.md always said "re-run the probes after a vendor update" while the probes
# were ad-hoc shell, written once and thrown away; several rows were wrong as a result, most
# expensively `--permission-prompt-tool`, which decision 0015 inverted its whole mechanism on.
# See docs/runbooks/vendor-probe.md.
vendor-probe = { cmd = "dotnet run --project tools/Aer.VendorProbe -- --out docs/vendor-capabilities.probe.json" }

# Vendor documentation survey (#527): the reading half of the same problem. `vendor-probe` above
# measures the binaries; this mirrors both vendors' published documentation and harvests the
# sentences that actually change decisions. Unlike vendor-probe it is safe anywhere — it only
# fetches public docs, drives no CLI, and spends no subscription usage.
#
# Both vendors publish a machine-readable index (claude: llms.txt with raw .md per page; agy:
# llms.txt + sitemap.xml, server-rendered). Reading ~250 pages by hand isn't repeatable, and a
# summarizing fetch is lossy — that produced the first, wrong reading of claude's `defer`. Every
# finding that changed a decision was one sentence sharing a recognisable grammar ("Bare mode skips
# OAuth and keychain reads"), so this harvests that class corpus-wide: 100% page coverage at ~1% of
# the bytes, plus a ledger giving every page a disposition so coverage is checkable, not asserted.
#
# Re-run on every vendor version bump — VendorProbeStalenessTests already fails when a CLI moves.
vendor-survey = { cmd = "python tools/vendor-survey/vendor_survey.py" }

# Vendor behaviour verification (#527): the third leg. vendor-survey reads what the vendors *say*;
# this runs what they *do*. Every check here is a behaviour an AER design decision rests on, and the
# audit that produced them found four vendor statements to be wrong and two that contradicted each
# other — so a doc page changing is a reason to re-run this, not a reason to trust the new page.
#
# NEVER runs in CI: it drives live authenticated CLIs and spends real subscription usage, same
# permanent-human-action-item rule as smoke-* and vendor-probe. Checks that would touch the
# operator's own ~/.claude or ~/.gemini are skipped unless --allow-config-writes is passed.
#
# Two rules the checks are built on, both learned by getting them wrong first: one variable per
# check (always a control arm), and execution proven by a sentinel FILE rather than by the model's
# prose. See tools/vendor-verify/README.md.
#
# A full run is long -- every arm is a real CLI session -- so run it per group and unbuffered:
#   pixi run vendor-verify -- --only gate
# `-u` is baked in: without it Python holds print output in a block buffer when stdout is
# redirected, and a run killed on a timeout loses everything it had already found.
vendor-verify = { cmd = "python -u tools/vendor-verify/verify.py" }

# Recomputes the #527 audit's completeness ledger: for each step of the chain, the population that
# was supposed to be covered and whether every member of it carries a disposition. Exists because
# "we read everything" is unfalsifiable -- documentation-lessons.md rule 15 says a completeness
# claim ships with the artifact that lets someone check it. Free: reads files, starts no session.
# It also prints what it CANNOT check, since a completeness checker that hides its own blind spots
# is precisely the failure it exists to prevent.
#
# STANDING CHECK (re-scoped 2026-07-26 -- see the SCOPE note in the script; it was run cold nine
# days after #527 and caught 11 undispositioned decisions and 2 orphaned vendor-verify checks).
# Run before a PR touching docs/decisions/, docs/vendor-*.md, or tools/vendor-verify/verify.py
# ships -- CLAUDE.md gate 8. Free except step 4 (closed-issue citation check), which needs `gh` and
# the network and skips loudly rather than failing when neither is available.
audit-completeness = { cmd = "python -u tools/audit-completeness/completeness.py" }
audit-selfcheck = { cmd = "python -u tools/audit-completeness/selfcheck.py" }
audit-controls = { cmd = "python -u tools/audit-completeness/controls.py" }

# The free half of the same suite, and the trigger for the paid half: compares each installed CLI's
# `--version` against the version recorded in the lock file. Starts no session and spends no quota,
# so it runs in the ordinary dev loop — `pixi run test` runs the same comparison via
# Aer.Architecture.Tests, which is what actually makes a vendor self-update surface. Exits non-zero
# when a CLI has moved; says so plainly, and does not pass, when no vendor CLI is present to inspect.
vendor-check = { cmd = "dotnet run --project tools/Aer.VendorProbe -- --check" }

# Dispatches one AER workflow step to a worker via a real `aer run` and prints its output -- the
# scaffolding an ad-hoc Node one-liner stood in for three times during the #513 cross-vendor
# orchestration trial, each time with a different bug (see tools/aer-agy-loop/dispatch.py's own
# docstring). Not a smoke test and not CI-wired: this is a dispatch primitive for whoever is
# orchestrating a multi-step worker exchange (implementer/reviewer or otherwise), same spirit as
# vendor-verify being a re-runnable instrument rather than a one-off script.
aer-dispatch = { cmd = "python tools/aer-agy-loop/dispatch.py" }

# M13 Phase 4 (#110), the milestone's completion gate: unlike smoke-claude/smoke-mixed-vendor
# above, this needs no live vendor auth, so it runs unattended in default CI rather than a gated
# runbook. Packs `aer`, installs it as a real global tool from that local nupkg, runs it against a
# one-step workflow whose `claude` adapter is satisfied by a local stub binary (no network), asserts
# the declared output landed on disk, then uninstalls -- see scripts/verify-pack-roundtrip.sh.
verify-pack = { cmd = "bash scripts/verify-pack-roundtrip.sh", depends-on = ["pack"] }

# M21 Phase 5 (#242): Windows-only override of build-sidecar's output name -- Aer.Daemon.csproj's
# copy-if-exists looks for aer-sidecar.exe specifically on Windows (native Go/.exe convention).
[target.win-64.tasks]
build-sidecar = { cmd = "go build -o bin/aer-sidecar.exe .", cwd = "src/Aer.Sidecar" }
